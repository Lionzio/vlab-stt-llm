name: CI Pipeline - vlab-stt-llm

# O pipeline vai rodar sempre que houver um push ou pull request na branch main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v4

    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip' # Usa cache do pip para rodar mais rápido nas próximas vezes

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Verificar formatação com Black
      run: |
        black --check src tests scripts

    - name: Linter com Ruff
      run: |
        ruff check src tests scripts

    - name: Rodar Testes Unitários (Pytest)
      run: |
        pytest tests/test_pipeline.py -v