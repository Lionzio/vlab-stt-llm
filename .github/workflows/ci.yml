name: CI Pipeline - vlab-stt-llm

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v4

    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Instalar Poetry e Dependências
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install --no-root

    - name: Verificar formatação com Black
      # Não quebra a build se o Black quiser formatar, apenas mostra o que faria
      run: |
        poetry run black src tests scripts

    - name: Linter com Ruff
      run: |
        poetry run ruff check --fix --ignore E501,B008 src tests scripts

    - name: Rodar Testes Unitários (Pytest)
      run: |
        poetry run pytest tests/test_pipeline.py -v