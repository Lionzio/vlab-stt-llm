name: CI Pipeline - vlab-stt-llm

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v4

    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Instalar Poetry e Dependências
      # Instalamos o Poetry e usamos a flag --no-root para evitar o erro de empacotamento
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install --no-root

    - name: Verificar formatação com Black
      # O "poetry run" garante que as ferramentas rodem dentro do ambiente isolado
      run: |
        poetry run black --check src tests scripts

    - name: Linter com Ruff
      run: |
        poetry run ruff check src tests scripts

    - name: Rodar Testes Unitários (Pytest)
      run: |
        poetry run pytest tests/test_pipeline.py -v