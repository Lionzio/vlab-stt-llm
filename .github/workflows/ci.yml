name: CI Pipeline - vlab-stt-llm

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v4

    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Instalar Poetry e Dependências
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install --no-root

    - name: Verificar formatação com Black
      run: |
        poetry run black src tests scripts

    - name: Linter com Ruff
      run: |
        poetry run ruff check --fix --ignore E501,B008 src tests scripts

    - name: Rodar Testes Unitários (Pytest)
      run: |
        poetry run pytest tests/test_pipeline.py -v

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Instalar dependências do Frontend
      run: |
        cd frontend
        npm ci

    - name: Build do Frontend (Validação TypeScript/React)
      run: |
        cd frontend
        npm run build